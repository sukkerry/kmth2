<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pahlawan Titik – Koordinasi Mata-Tangan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="clouds" aria-hidden="true"><i></i><i></i><i></i></div>

<main class="app">
  <!-- MENU -->
  <section id="menu" class="screen active">
    <h1 class="logo">Pahlawan <span>Titik</span></h1>
    <p class="sub">Kutip titik mengikut nombor. 6 corak garisan rawak!</p>
    <div class="cards">
      <button class="card c1" data-level="1">
        <b class="emoji">🌱</b><h2>Mudah</h2>
        <p>Meniru corak garisan panduan</p><em id="st1">☆☆☆</em>
      </button>
      <button class="card c2" data-level="2">
        <b class="emoji">🔥</b><h2>Sederhana</h2>
        <p>Menyambung titik-titik bernombor</p><em id="st2">☆☆☆</em>
      </button>
      <button class="card c3" data-level="3">
        <b class="emoji">🚀</b><h2>Mencabar</h2>
        <p>Menulis semula corak dari ingatan</p><em id="st3">☆☆☆</em>
      </button>
    </div>
    <button id="btnInfo" class="btn ghost">📘 Maklumat DSKP (Guru)</button>
  </section>

  <!-- GAME -->
  <section id="play" class="screen">
    <div class="hud">
      <button id="btnMenu" class="btn small" aria-label="Menu">🏠</button>
      <span id="hLevel" class="pill">Mudah</span>
      <span id="hLives" class="pill">❤️❤️❤️</span>
      <span id="hDots" class="pill">🔵 0/0</span>
      <span id="hScore" class="pill">⭐ 0</span>
      <button id="btnHint" class="btn small hide" aria-label="Petunjuk">💡</button>
      <button id="btnSound" class="btn small" aria-label="Bunyi">🔊</button>
    </div>
    <div class="stage">
      <canvas id="game"></canvas>
      <div id="msg" class="toast"></div>
    </div>
    <div class="pad" aria-label="Kawalan">
      <div>
        <button class="pb" data-k="left" aria-label="Kiri">◀</button>
        <button class="pb" data-k="right" aria-label="Kanan">▶</button>
      </div>
      <button class="pb jump" data-k="jump" aria-label="Lompat">⬆ Lompat</button>
    </div>
    <p class="keys">Papan kekunci: ← → atau A D untuk bergerak, Ruang / ↑ untuk lompat</p>
  </section>
</main>

<div id="modal" class="modal"><div class="box" id="modalBox"></div></div>

<script src="script.js"></script>
</body>
</html>
